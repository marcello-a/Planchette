name: Build & Release

# Builds GhosttyKit + the app and runs tests on every push to the default
# branch. When the merged pull request ticked "Trigger new release", then
# scripts/auto-release.sh decides whether the push releases (tag + DMG/zip/checksums):
#
#   - VERSION names a version that is not published yet: that version goes out as
#     written (a release commit written by hand — a minor or major bump).
#   - VERSION is already published, and the commits since the last release carry a
#     feat, fix or perf: the patch number goes up by one, on a commit of its own,
#     and that goes out. So a merge to main publishes without anyone touching VERSION.
#
# A push that carries only chore, docs, test, style or refactor is a build and
# nothing more; `[skip release]` in the head commit's message opts a push out.
# Releasing locally still works too: `scripts/release.sh` (reads the same VERSION).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    # macos-15 ships a recent macOS SDK; ghostty v1.3.1 needs CoreVideo symbols
    # (e.g. kCVPixelFormatType_30RGB_r210) absent from the older 14.x SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer" || true

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cache GhosttyKit build
        uses: actions/cache@v4
        with:
          path: |
            vendor/ghostty/.zig-cache
            vendor/ghostty/zig-out
            ~/.cache/zig
          key: ghostty-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-v1.3.1

      - name: Build GhosttyKit
        run: |
          set -eu
          ( cd vendor/ghostty && zig build -Demit-macos-app=false -Dxcframework-target=native -Doptimize=ReleaseFast )
          cp -R vendor/ghostty/macos/GhosttyKit.xcframework macos/Planchette/

      - name: Test
        run: cd macos/Planchette && swift test

      - name: Test the release rules
        run: sh scripts/test-auto-release.sh

      # A merge releases only when its pull request has "Trigger new release" ticked
      # (.github/pull_request_template.md). A push without a pull request does not
      # release; a manual run (workflow_dispatch) always may.
      - name: Does the merged PR ask for a release?
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].body // ""')"
          if printf '%s\n' "$BODY" | grep -Eqi '^[[:space:]]*[-*] \[x\] .*trigger new release'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "≡ the pull request does not tick 'Trigger new release' — build + test only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release (when this push carries something to release)
        if: steps.ask.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The same release script a maintainer runs by hand — deliberately, so an
          # automated release and a local one cannot differ. It carries the one
          # thing a hand-written `gh release create` here kept losing: the release
          # body IS this version's CHANGELOG section, and the app reads it back to
          # show "What's new" in the update dialog (ReleaseNotes.swift). A generic
          # "Automated release 0.2.32" left every updating user with nothing to read.
          sh scripts/auto-release.sh
