name: Checks

# Every pull request: builds GhosttyKit and the app, runs the tests and the release rules.
# It never releases and cannot (read-only token, no release step) — that is the release
# workflow's job, on main. Its GhosttyKit artifact is the one to download on a Mac that
# cannot build it (CONTRIBUTING.md).

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The same runner as the release: ghostty v1.3.1 needs the recent macOS SDK of macos-15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/ghosttykit

      - name: Test
        # The notepad's random edit walks run with two seeds each on a pull request.
        env:
          NOTEPAD_DEEP: "2"
        run: cd macos/Planchette && swift test

      - name: Test the release rules
        run: sh scripts/test-auto-release.sh

      - name: Test the libghostty patches
        run: sh scripts/test-ghostty-patches.sh

      # Builds the hook helper as package.sh does (universal, warnings are errors) and
      # runs it against the shell script it replaces, byte for byte.
      - name: Test the native hook forwarder
        run: sh scripts/test-hook-helper.sh
